name: Generate APK

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  push:
    branches:
      - 'master'

permissions:
  contents: write

jobs:
  build:
    name: Build and release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Runs the unit tests and lint, and assembles the APKs
      - name: Build gradle project
        run: ./gradlew build

      - name: Read app version
        run: echo "version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFWIG-${{ env.version }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # One release per versionName: pushes that don't bump the version only build
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version already exists, skipping"
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk SFWIG.apk
          gh release create "$version" SFWIG.apk --target "$GITHUB_SHA" \
            --title "${{ github.event.repository.name }} v$version" --generate-notes
